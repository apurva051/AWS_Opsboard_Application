# Local stand-in for CloudFront + ALB path-based routing.
# In AWS: CloudFront serves the frontend from S3 and forwards /api/* to the ALB,
# whose listener rules send each path prefix to its own target group.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/deployments {
    proxy_pass http://deploy-service:8080;
    proxy_set_header Host $host;
  }

  location /api/incidents {
    proxy_pass http://incident-service:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
